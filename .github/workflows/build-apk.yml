name: Build OMAR STORE V2 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: omar-store-v2-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare intro video asset
        run: |
          mkdir -p assets
          curl -fL --retry 3 -o assets/intro.mp4 https://raw.githubusercontent.com/Omar6373/OMAR-STORE-V2/main/omar_logo_no_capcut.mp4
          curl -fL --retry 3 -o assets/welcome.png https://raw.githubusercontent.com/Omar6373/OMAR-STORE-V2/main/file_00000000ea9881f4bc6615e27a4436db.png
      - name: Generate welcome entry chime
        run: |
          mkdir -p assets/sounds
          python3 - <<'PY'
          import math, wave, struct
          rate=22050
          duration=.48
          with wave.open('assets/sounds/enter.wav','wb') as out:
              out.setnchannels(1);out.setsampwidth(2);out.setframerate(rate)
              frames=[]
              for i in range(int(rate*duration)):
                  t=i/rate
                  env=(1-math.exp(-35*t))*math.exp(-6*t)
                  freq=660 if t<.15 else (880 if t<.32 else 1100)
                  value=int(11000*env*(math.sin(2*math.pi*freq*t)+.20*math.sin(4*math.pi*freq*t)))
                  frames.append(struct.pack('<h',max(-32768,min(32767,value))))
              out.writeframes(b''.join(frames))
          PY
      - name: Generate Android project
        run: flutter create --platforms android --org com.omarayad .
      - name: Install OS launcher icon
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path('file_0000000056c081f496e56264005a2336.png')
          if not source.is_file():
              raise SystemExit('OS icon image missing from repository')
          image = Image.open(source).convert('RGBA')
          densities = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
          for density, size in densities.items():
              folder = Path(f'android/app/src/main/res/mipmap-{density}')
              folder.mkdir(parents=True, exist_ok=True)
              image.resize((size, size), Image.Resampling.LANCZOS).save(folder / 'ic_launcher.png')
          print('OS launcher icon generated for all Android densities')
          PY
      - name: Enable Android internet access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace('<application', permission + '\n    <application', 1)
          import re
          s = re.sub(r'android:label="[^"]*"', 'android:label="OMAR STORE"', s, count=1)
          p.write_text(s)
          PY
      - name: Configure Start.io live ads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          meta = '''<meta-data android:name="com.startapp.sdk.APPLICATION_ID" android:value="210952444" />
          <meta-data android:name="com.startapp.sdk.RETURN_ADS_ENABLED" android:value="false" />'''
          s = s.replace('<application', '<application', 1)
          s = s.replace('</application>', meta + '\n    </application>', 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Fix Start.io SDK compile API level
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          matches = list(Path.home().glob('.pub-cache/hosted/pub.dev/startapp_sdk-*/android/build.gradle'))
          if not matches:
              raise SystemExit('Start.io Gradle file not found')
          for p in matches:
              s = p.read_text()
              s, count = re.subn(r'compileSdkVersion[^\n]*', 'compileSdkVersion 36', s)
              if not count:
                  s, count = re.subn(r'compileSdk\s*=?\s*[^\n]+', 'compileSdk 36', s)
              if not count:
                  raise SystemExit(f'compileSdk declaration not found in {p}')
              p.write_text(s)
              print('Start.io compile SDK set to 36:', p)
              print('\n'.join(line for line in s.splitlines() if 'compileSdk' in line))
          PY
      - name: Restore Firebase configuration
        run: |
          mkdir -p firebase
          curl -fL --retry 3 -o firebase/google-services.json https://raw.githubusercontent.com/Omar6373/omar/dfb9c333/firebase/google-services.json
      - name: Read Firebase Android config
        run: |
          echo "FIREBASE_API_KEY=$(jq -r '.client[0].api_key[0].current_key' firebase/google-services.json)" >> "$GITHUB_ENV"
          echo "FIREBASE_APP_ID=$(jq -r '.client[0].client_info.mobilesdk_app_id' firebase/google-services.json)" >> "$GITHUB_ENV"
          echo "FIREBASE_SENDER_ID=$(jq -r '.project_info.project_number' firebase/google-services.json)" >> "$GITHUB_ENV"
          echo "FIREBASE_PROJECT_ID=$(jq -r '.project_info.project_id' firebase/google-services.json)" >> "$GITHUB_ENV"
          echo "FIREBASE_STORAGE_BUCKET=$(jq -r '.project_info.storage_bucket' firebase/google-services.json)" >> "$GITHUB_ENV"
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET"
      - uses: actions/upload-artifact@v4
        with:
          name: OMAR-STORE-V2-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk OMAR-STORE-V2.apk
          if ! gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v2.0.0 OMAR-STORE-V2.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "OMAR STORE v2.0.0" \
              --notes "تطبيق OMAR STORE للأندرويد مع فيديو الافتتاح. تنزيل مباشر APK."
          else
            gh release upload v2.0.0 OMAR-STORE-V2.apk --clobber --repo "$GITHUB_REPOSITORY"
          fi
